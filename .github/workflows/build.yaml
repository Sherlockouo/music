name: Build & Release

on:
  push:
    branches: [release]

jobs:
  build-release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ⚙️ Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install global dependencies
        run: |
          pnpm add -g prisma fastify-cli turbo tsx electron-builder@24

      - name: 📥 Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Setup environment file
        run: cp .env.example .env

      # 可选：构建 sqlite3 native 模块或其他前置依赖
      # - name: 🧱 Build sqlite3 binaries
      #   run: tsx ./scripts/build.sqlite3.ts

      # Linux 专用构建依赖
      - name: 🐧 Install packaging tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm bsdtar libopenjp2-tools

      - name: ⚡ Build Electron Pre-Release
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: "true"
          ENABLE_LOCAL_VIP: "svip"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm package

      # 可选：启用完整发布流程（打 tag 自动上传 release）
      - name: 🚀 Build & Release Electron app
        uses: njzydark/action-electron-builder-pnpm@v1.2.0-pnpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          package_manager: pnpm
          args: package

      # ---- Upload Artifacts ----

      - name: ⬆️ Upload macOS (Universal)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: R3PLAYX-mac-universal
          path: packages/desktop/release/*-universal.dmg
          if-no-files-found: ignore

      - name: ⬆️ Upload macOS (x64)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: R3PLAYX-mac-x64
          path: packages/desktop/release/*-x64.dmg
          if-no-files-found: ignore

      - name: ⬆️ Upload macOS (arm64)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: R3PLAYX-mac-arm64
          path: packages/desktop/release/*-arm64.dmg
          if-no-files-found: ignore

      - name: ⬆️ Upload macOS latest.yml
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: latest-mac
          path: packages/desktop/release/latest-mac.yml
          if-no-files-found: ignore

      - name: ⬆️ Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: R3PLAYX-win
          path: packages/desktop/release/*x64-Setup.exe
          if-no-files-found: ignore

      - name: ⬆️ Upload Windows latest.yml
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: latest-win
          path: packages/desktop/release/latest.yml
          if-no-files-found: ignore

      - name: ⬆️ Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: R3PLAYX-linux-appimage
          path: packages/desktop/release/*.AppImage
          if-no-files-found: ignore

      - name: ⬆️ Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: R3PLAYX-linux-deb
          path: packages/desktop/release/*.deb
          if-no-files-found: ignore

      - name: ⬆️ Upload Linux latest.yml
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: latest-linux
          path: packages/desktop/release/latest-linux.yml
          if-no-files-found: ignore
