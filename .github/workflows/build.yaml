name: Build R3PLAYX

on:
  push:
    branches:
      - release
      - dev

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 如果一个 OS 失败，不取消其他 OS 的构建
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.2
          cache: 'pnpm' # 自动处理 pnpm 缓存，无需手动配置

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.6.12
          run_install: false # 由后续步骤显式安装

      # 合并了两个文件的依赖逻辑，并清理了不必要的全局安装
      # 建议：将 prisma, turbo 等放入 package.json 的 devDependencies 中，避免在此处全局安装
      - name: Install global dependencies
        run: |
          npm i prisma fastify-cli turbo tsx electron-builder@23.6.0 node-gyp-install -g
          node-gyp-install --python=python3

      - name: Install dependencies
        run: pnpm install

      - name: Setup Environment
        run: cp .env.example .env

      - name: Build Electron App
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm package

      # --- Artifact Upload Optimization ---
      # 使用通配符一次性上传，并根据 OS 区分，避免警告

      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-mac
          path: |
            ./packages/desktop/release/*.dmg
            ./packages/desktop/release/latest-mac.yml

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-win
          path: |
            ./packages/desktop/release/*.exe
            ./packages/desktop/release/latest.yml

      - name: Upload Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-linux
          path: |
            ./packages/desktop/release/*.AppImage
            ./packages/desktop/release/*.deb
            ./packages/desktop/release/latest-linux.yml
