      author: maintainer
    - text: 卡片内容面向维护项目的中高级工程师，聚焦职责、请求链路与数据流向，不复述代码细节。
      author: maintainer
    - text: 技术栈事实以各 packages/*/package.json 为准（Electron 43、Fastify 5、Prisma 6、React 19），CLAUDE.md 中的版本信息已过时。
